name: Validate and Build BDO Vision Lite
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python compilation
        run: python -m compileall -q desktop tests
      - name: Check bundled planner JavaScript
        run: |
          python - <<'PYJS'
          import re, pathlib
          html=pathlib.Path('bdo-market-intelligence.html').read_text(encoding='utf-8')
          pathlib.Path('/tmp/bdo-planner.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html,re.S)))
          PYJS
          node --check /tmp/bdo-planner.js
  windows-exe:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install Pillow pywinauto pyinstaller
      - name: Build EXE
        run: >-
          python -m PyInstaller --onefile --noconsole --clean
          --name BDO-Vision-Lite
          --icon desktop/assets/bdo-lite.ico
          --distpath build-output
          --hidden-import=tracking_core --hidden-import=spatial_ocr
          --hidden-import=scan_engine --hidden-import=ocr_parser
          --hidden-import=planner_bridge --hidden-import=windows_bdo
          --hidden-import=comtypes --hidden-import=pywinauto
          desktop/app.py
      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/BDO-Vision-Lite/desktop/assets | Out-Null
          Copy-Item build-output/BDO-Vision-Lite.exe release/BDO-Vision-Lite/desktop/
          Copy-Item desktop/assets/* release/BDO-Vision-Lite/desktop/assets/
          Copy-Item bdo-market-intelligence.html release/BDO-Vision-Lite/
          Copy-Item README.md release/BDO-Vision-Lite/
          Copy-Item RELEASE_NOTES.md release/BDO-Vision-Lite/
          Compress-Archive -Path release/BDO-Vision-Lite -DestinationPath BDO-Vision-Lite-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BDO-Vision-Lite-Windows-Portable
          path: BDO-Vision-Lite-Windows.zip
