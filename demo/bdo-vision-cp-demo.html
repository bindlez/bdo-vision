 html+='<div class="cp-routes">'+r.routes.map(card).join('')+'</div></section><section class="cp-card"><h2>'+esc(names[chosen.key])+' · the plan</h2><div class="cp-row"><span>CP EXP until '+(r.cp+1)+' CP</span><b>'+fmt(r.nextXp,2)+' EXP · '+fmt(r.nextBatches)+' batches</b></div><div class="cp-progress" aria-label="Current CP progress '+r.percent+' percent"><span style="width:'+r.percent+'%"></span></div><div class="cp-row"><span>Distance to '+r.target+' CP</span><b>'+fmt(r.targetXp,2)+' EXP · '+fmt(r.targetBatches)+' batches</b></div><p class="cp-status">'+(r.target<=r.cp?'Target is already reached. No CP exchange is needed.':r.targetReachable?'Your stock covers this target. Mixed stocks spend the least silver per 900 EXP first, using the selected cash policy.':'Target is short by '+fmt(Math.max(0,r.targetBatches-r.totalBatches))+' exchange batches. The target route uses your available full batches.')+'</p><div class="cp-table-wrap"><table><thead><tr><th>Byproduct</th><th>To CP</th><th>Remaining for cash</th><th>Cash route</th></tr></thead><tbody>'+chosen.allocation.map(a=>'<tr><td>'+esc(a.name)+'</td><td>'+fmt(a.items)+'<small>'+fmt(a.batches)+' × 900 EXP</small></td><td>'+fmt(a.remaining)+'</td><td>'+esc(a.cashRoute)+'</td></tr>').join('')+'</tbody></table></div><div class="cp-fields"><div class="cp-verdict"><b>Break-even</b><p>'+(chosen.foregone===0?'No silver sacrificed.':chosen.breakEvenDays===null?'Not reached with zero modeled extra income.':fmt(chosen.breakEvenDays,1)+' days from now, including setup delay.')+'</p></div><div class="cp-verdict"><b>Required extra income</b><p>'+(chosen.requiredPerCpDay==null?'No deployable new CP in this route / time window.':fmt(Math.ceil(chosen.requiredPerCpDay))+' silver / deployed CP / day to catch cash by day '+r.days+'.')+'</p></div></div><p class="cp-status">'+chosen.deployed+' of '+chosen.gained+' new whole CP deployed. CP progress itself has no recurring income. '+(chosen.unmodeledXp?'Curve stops at 600 CP; '+fmt(chosen.unmodeledXp)+' remaining EXP is unmodeled. No level is invented beyond that limit.':'Final CP percentages are approximate because your starting percentage is rounded in game.')+'</p></section>';
 html+='<div class="cp-chart-grid"><section class="cp-card"><h2>Today’s cash vs tomorrow’s income</h2><small>Silver from this decision only · no existing income included</small>'+timeline(r)+'<div class="cp-chart-caption">'+r.routes.slice(0,3).map(x=>'<span class="cp-key" style="--key:'+colors[x.key]+'">'+esc(names[x.key])+'</span>').join('')+'</div></section><section class="cp-card"><h2>Find your compromise</h2><small>Silver kept now vs whole CP gained · 21 bounded samples</small>'+frontier(r)+'<p class="cp-status">Each point shifts 5% more full batches into CP. Click a point to set your custom split.</p></section></div>';
 html+='<section class="cp-card"><h2>What could you cash out?</h2><p class="cp-status">Gross = reward quantity × market unit price. Net = gross × sale retention + leftover byproducts sold to NPC. One reward per exchange; these options are mutually exclusive. No tax on direct NPC sales. Market values are estimates, not guaranteed sales; large volumes may take time to sell.</p><div class="cp-table-wrap"><table><thead><tr><th>Byproduct → reward</th><th>Output quantity</th><th>Unit price</th><th>Gross silver</th><th>Net + leftover NPC sale</th></tr></thead><tbody>'+r.exchangeRoutes.map(x=>'<tr><td>'+esc(x.item)+'<small>'+esc(x.product)+' · '+esc(x.source)+'<br>'+esc(x.updated_at)+'</small></td><td>'+fmt(x.batches*x.units)+'</td><td>'+fmt(x.unit)+'</td><td>'+money(x.gross)+'</td><td>'+money(x.net)+'</td></tr>').join('')+'</tbody></table></div></section>';
 html+='<section class="cp-card"><h2>CP info · know the cost curve</h2><p class="cp-status">At '+r.cp+' CP, the next point costs '+fmt(engine.xpPerCp(r.cp))+' EXP. At 500 it costs 571,594; at 525 it costs 914,550. The next 25-point bands grow more expensive, so buying CP without a use for it delays your payoff.</p><details><summary>Every CP bracket · current CP → next CP</summary><div class="cp-table-wrap"><table><thead><tr><th>Current CP</th><th>EXP / CP</th><th>10-item byproducts / CP*</th><th>20-item Blush Leaf / CP*</th></tr></thead><tbody>'+spec.curve.map((b,i)=>'<tr><td>'+b[0]+'–'+((spec.curve[i+1]?.[0]??600)-1)+'</td><td>'+fmt(b[1])+'</td><td>'+fmt(b[1]/90,2)+'</td><td>'+fmt(b[1]/45,2)+'</td></tr>').join('')+'</tbody></table></div><p>*Continuous efficiency for comparison; actual turn-ins require complete 10/20-item batches. Stop at 600: higher brackets are outside this model.</p></details><details><summary>Formulas, assumptions & limitations</summary><p>Available EXP = Σ floor(stock / exchange size) × 900. Advance through each CP bracket in order; never multiply total EXP by today’s CP rate. Target batches = ceil(EXP missing / 900). Leftover items retain their NPC cash value.</p><p>Extra income = min(new whole CP, deployable CP limit) × your extra net silver per CP per day × max(0, days − setup delay). Cash + extra income is a scenario outcome, not recorded profit. CP opportunity cost = cash route − cash retained after CP exchange. Break-even = setup delay + opportunity cost / extra daily income.</p><p>Fixed income begins after the specified setup delay. Worker capacity, jobs, node bottlenecks and housing costs are not automatically modeled. No interest on cash, future byproduct generation, CP refunds, changing market prices or bonus CP EXP buffs are assumed. Lifetime skill EXP is a separate benefit and is not assigned a silver value. No continuous screen reading, animation loop, chart library or background CP price refresh runs here.</p></details><details><summary>Exchange locations, sources & data freshness</summary>'+spec.products.map(p=>'<p><a href="'+p.url+'" target="_blank" rel="noopener noreferrer">'+esc(p.name)+'</a> · '+p.batch+' items → '+p.xp+' CP EXP · NPC: '+esc(p.npc)+'.</p>').join('')+spec.sources.map(s=>'<p><a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+'</a></p>').join('')+'<p>Data checked '+spec.version+'. Integer EXP reconstructed from the public byproducts/level table × 90, rounded to the nearest EXP through 599 CP. Screenshots confirmed the cooking/farming exchanges. Recheck after game balance patches.</p></details><details><summary>CP reader · last-seen diagnostics</summary><pre id="cpDiagnostic">'+esc(lastReading?JSON.stringify(lastReading,null,2):'No CP capture requested. The calculator works without OCR. Inventory counts are entered manually; no background quantity scanning is added.')+'</pre></details></section>';
 document.getElementById('cpOutput').innerHTML=html;
}
function plot(series,xmax,ymax,label,xlabel){
 const w=480,h=225,l=61,t=22,r=16,b=34,pw=w-l-r,ph=h-t-b,xx=x=>l+x/Math.max(1,xmax)*pw,yy=y=>t+ph-y/Math.max(1,ymax)*ph;
 let svg='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label)+'"><title>'+esc(label)+'</title>';
 for(let i=0;i<=4;i++){const y=ymax*i/4;svg+='<line x1="'+l+'" y1="'+yy(y)+'" x2="'+(w-r)+'" y2="'+yy(y)+'" stroke="#30283e"/><text x="'+(l-6)+'" y="'+(yy(y)+4)+'" text-anchor="end" fill="#b9b0cb" font-size="10">'+money(y)+'</text>';}
 for(const s of series)svg+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.5" points="'+s.points.map(p=>xx(p[0]).toFixed(2)+','+yy(p[1]).toFixed(2)).join(' ')+'"/>'+(s.click?s.points.map(p=>'<circle data-frontier="'+p[2]+'" cx="'+xx(p[0])+'" cy="'+yy(p[1])+'" r="4" tabindex="0" role="button" aria-label="'+p[2]+' percent to CP, '+p[0]+' CP gained, '+money(p[1])+' silver kept" fill="#f2ca79"><title>'+p[2]+'% → +'+p[0]+' CP, '+money(p[1])+' silver kept</title></circle>').join(''):'');
 return svg+'<text x="'+l+'" y="'+(h-12)+'" fill="#b9b0cb" font-size="10">0</text><text x="'+(w-r)+'" y="'+(h-12)+'" text-anchor="end" fill="#b9b0cb" font-size="10">'+fmt(xmax)+' '+esc(xlabel)+'</text></svg>';
}
function timeline(r){const sample=Array.from({length:25},(_,i)=>r.days*i/24),series=r.routes.slice(0,3).map(a=>({color:colors[a.key],points:[...new Set([...sample,Math.min(r.days,r.delay)])].sort((a,b)=>a-b).map(day=>[day,a.cash+a.daily*Math.max(0,day-r.delay)])}));return plot(series,r.days,Math.max(1,...series.flatMap(s=>s.points.map(p=>p[1]))),'Cash and CP route silver outcomes over '+r.days+' days','days');}
function frontier(r){const points=Array.from({length:21},(_,i)=>{const p=engine.calculate({...state,split:i*5},quotes).routes[3];return [p.gained,p.cash,i*5];});return plot([{color:colors.target,points,click:true}],Math.max(1,...points.map(p=>p[0])),Math.max(1,r.cashTotal),'Allocation frontier: new CP gained versus silver kept now','new CP');}
let scheduled;
host.addEventListener('input',e=>{const key=e.target.dataset.cp,stock=e.target.dataset.stock;if(!key&&!stock)return;if(stock)state.counts[stock]=e.target.value===''?'':Number(e.target.value);else state[key]=key==='cashPolicy'?e.target.value:e.target.value===''?'':Number(e.target.value);state.example=false;clearTimeout(scheduled);scheduled=setTimeout(render,100);});
host.addEventListener('click',e=>{const route=e.target.closest('[data-route]'),point=e.target.closest('[data-frontier]'),preset=e.target.closest('[data-income]');if(route){selected=route.dataset.route;render();}if(point){state.split=Number(point.dataset.frontier);selected='split';syncInputs();render();}if(preset){state.income=Number(preset.dataset.income);syncInputs();render();}});
host.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-frontier]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.getElementById('cpExample').onclick=()=>{state=structuredClone(defaults);syncInputs();render();};
document.getElementById('cpClear').onclick=()=>{state.counts={catalyst:0,witch:0,leaf:0};state.example=false;syncInputs();render();};
async function cachedPrices(){if(!base()||demo)return;try{const response=await fetch(base()+'/prices',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw Error('No cached prices');const payload=await response.json();quoteRegion=marketRegion();quotes=Object.fromEntries(Object.entries(payload.prices||{}).filter(([name,q])=>!q.region||q.region===quoteRegion));render();status('cpPriceState',quoteRegion+' · existing quote cache loaded. Refresh for current exchange prices.');}catch(e){status('cpPriceState','NPC baseline available. Open this page from Vision for Central Market quotes.');}}
document.getElementById('cpPrices').onclick=async()=>{if(busy)return;if(!base()||demo){status('cpPriceState','Open CP Info from the Windows app for existing Central Market prices. This offline demo uses verified NPC values only.');return;}busy=true;const button=document.getElementById('cpPrices');button.disabled=true;status('cpPriceState','Looking up exact reward names in your existing market database…');const requestRegion=marketRegion();try{const response=await fetch(base()+'/craft-quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region:requestRegion,names:spec.products.flatMap(p=>p.rewards.map(r=>r[0]))}),signal:AbortSignal.timeout(60000)});const payload=await response.json();if(!response.ok)throw Error(payload.error||'Market lookup unavailable');if(requestRegion!==marketRegion())throw Error('Market region changed; refresh for the selected region');if(quoteRegion!==requestRegion)quotes={};quoteRegion=requestRegion;const at=new Date().toISOString();for(const q of payload.items||[])quotes[q.name]={unit_price:q.price,source:'Central Market ('+requestRegion+')',updated_at:at,region:requestRegion};render();status('cpPriceState',requestRegion+' · '+(payload.items||[]).length+' exact reward prices refreshed at '+new Date().toLocaleTimeString()+'. Missing rewards stay unpriced.');}catch(e){status('cpPriceState',e.message+' · cached prices retained',true);}finally{busy=false;button.disabled=false;}};
function acceptReading(payload){lastReading=payload;if(payload.stage!=='accepted'){status('cpReadState',payload.message||'No accepted CP reading yet. Your inputs are preserved.');render();return;}state.cp=payload.cp;state.percent=payload.percent;state.example=false;syncInputs();render();status('cpReadState','Last seen '+new Date(payload.at*1000).toLocaleString()+' · '+payload.cp+' CP + '+payload.percent+'%. Inventory counts remain your entered values.');}
document.getElementById('cpLast').onclick=async()=>{if(!base()||demo){status('cpReadState','Live Windows OCR is available only in the paired local app. This demo has no screen access.');return;}try{const reply=await fetch(base()+'/cp-reading',{cache:'no-store'});if(!reply.ok)throw Error('Update Vision to the CP Info build');acceptReading(await reply.json());}catch(e){status('cpReadState',e.message,true);}};
document.getElementById('cpRead').onclick=async()=>{if(readBusy)return;if(!base()||demo){status('cpReadState','Browser demo only. It cannot see BDO, use global shortcuts, or restore the game from the tray. Use the Windows app for a live CP snapshot.');return;}readBusy=true;const button=document.getElementById('cpRead');button.disabled=true;try{const h=await fetch(base()+'/health',{cache:'no-store'});if(!h.ok)throw Error('Vision is unavailable');const health=await h.json(),reply=await fetch(base()+'/cp-read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instance_id:health.instance_id})});const accepted=await reply.json();if(!reply.ok)throw Error(accepted.error||'Update Vision to the CP Info build');status('cpReadState','Bring BDO in front now · one HUD snapshot in 3 seconds, then two bounded OCR passes.');for(let i=0;i<14;i++){await new Promise(resolve=>setTimeout(resolve,1000));const res=await fetch(base()+'/cp-reading',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!res.ok)throw Error('CP reader unavailable');const p=await res.json();if(p.requestId===accepted.id&&['accepted','rejected'].includes(p.stage)){acceptReading(p);return;}}throw Error('One-shot request timed out. Values are preserved; no automatic retry.');}catch(e){status('cpReadState',e.message,true);}finally{readBusy=false;button.disabled=false;}};
// Called only when this view opens. No interval, visibility watcher or OCR loop.
let loaded=false;
window.VisionCPPage={open(){if(quoteRegion&&quoteRegion!==marketRegion()){quotes={};quoteRegion='';loaded=false;render();}if(!loaded){loaded=true;cachedPrices();}},render};
document.querySelectorAll('.region-btn').forEach(button=>button.addEventListener('click',()=>{if(quoteRegion&&quoteRegion!==marketRegion()){quotes={};quoteRegion='';loaded=false;render();status('cpPriceState','Region changed to '+marketRegion()+'. Old-region prices cleared; refresh exchange prices for this region.');}}));
if(demo){document.getElementById('cpPrices').disabled=true;document.getElementById('cpRead').textContent='About live OCR';}
render();
})();
