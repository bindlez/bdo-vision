name: Windows regression and release package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Tesseract
        run: choco install tesseract --yes --no-progress
      - name: Generate safe branding and synthetic test images
        run: python scripts/generate_assets.py
      - name: Check native regressions in isolated profiles
        run: python scripts/run_tests.py
      - name: Check planner JavaScript
        run: python scripts/check_planner.py
      - name: Compile sources
        run: python -m compileall -q desktop scripts tests
      - name: Build source release with checksums
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: BDO-Vision-Windows-Source
          path: dist/BDO-Vision-*.zip*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-report
          path: build/test-report.txt
