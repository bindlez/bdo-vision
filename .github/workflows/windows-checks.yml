name: Windows regression and release package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pywinauto
      - name: Install Tesseract
        run: choco install tesseract --yes --no-progress
      - name: Generate safe branding and synthetic test images
        run: python scripts/generate_assets.py
      - name: Check native regressions in isolated profiles
        run: python scripts/run_tests.py
      - name: Check planner JavaScript
        run: python scripts/check_planner.py
      - name: Check equipment planner rules
        run: node scripts/test_gear_core.js
      - name: Check untrusted market text rendering
        run: node scripts/test_planner_security.js
      - name: Check Big Drops rendering and shipped ownership
        run: node scripts/test_big_drops.js
      - name: Check CP calculations and shipped ownership
        run: node scripts/test_cp.js
      - name: Check actual CP page interactions
        run: node scripts/test_cp_page.js
      - name: Check Workerman CP payback interactions
        run: node scripts/test_cp_workerman.js
      - name: Check crafting and imperial quick picks
        run: |
          node scripts/test_crafting.js
          node scripts/test_crafting_page.js
          node scripts/test_crafting_logistics.js
          node scripts/test_auto_craft_page.js
          node scripts/test_imperial.js
      - name: Compile sources
        run: python -m compileall -q desktop scripts tests
      - name: Build and validate Developer Handbook
        run: python scripts/build_handbook.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: BDO-Vision-Developer-Handbook
          path: build/developer-handbook/
      - name: Build source release with checksums
        run: python scripts/package_release.py
      - name: Build lean Windows application
        run: python scripts/build_windows.py
      - name: Verify extracted Windows application
        run: python scripts/check_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: BDO-Vision-Release-Packages
          path: dist/BDO-Vision-*.zip*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-report
          path: build/test-report.txt
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BDO-Vision-Release-Packages
          path: release-packages
      - name: Publish verified friend test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          case "$version" in *-rc.*) ;; *) echo 'Only explicit release candidates publish here.'; exit 0;; esac
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "v$version" release-packages/*.zip release-packages/*.sha256 --target "$GITHUB_SHA" --prerelease --title "BDO Vision $version · friend test" --notes-file docs/FRIEND-TEST.md
  first_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/gear-planner'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BDO-Vision-Release-Packages
          path: release-packages
      - name: Publish the verified first release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [ "$version" != '1.12.0' ]; then exit 0; fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Existing release preserved; no files overwritten.'
            exit 0
          fi
          gh release create "v$version" release-packages/*.zip release-packages/*.sha256 --target "$GITHUB_SHA" --title "BDO Vision $version" --notes-file docs/FIRST-RELEASE.md
